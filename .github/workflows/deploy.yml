name: Hexo Deploy

on:
  push:
    branches:
      - master  # 触发部署的分支，默认是 main 或 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # 根据你的 Node.js 版本修改

      - name: Install Hexo and dependencies
        run: |
          npm install -g hexo-cli
          npm install

      - name: Build Hexo site
        run: hexo generate

      - name: Deploy to GitHub Pages
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}  # 使用之前配置的 Secret
        run: |
          git config --global user.name "fibbery"  # 替换为你的名字
          git config --global user.email "jiangnenghua1992@gmail.com"  # 替换为你的邮箱
          hexo deploy