name: Hexo Deploy

on:
  push:
    branches:
      - master  # 触发部署的分支，默认是 main 或 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # 根据你的 Node.js 版本修改

      - name: Install Hexo and dependencies
        run: |
          npm install -g hexo-cli
          npm install
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build Hexo site
        run: hexo generate

      - name: Deploy to GitHub Pages
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git config --global user.name "fibbery" 
          git config --global user.email "jiangnenghua1992@gmail.com"
          hexo deploy